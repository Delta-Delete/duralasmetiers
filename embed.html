<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duralas Metiers Embed</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      min-height: 0;
    }

    #embed-frame {
      display: block;
      width: 100%;
      min-height: 1px;
      border: 0;
      background: transparent;
      overflow: hidden;
    }

    #embed-error {
      display: none;
      padding: 12px;
      color: #dbcca8;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <iframe id="embed-frame" scrolling="no"></iframe>
  <div id="embed-error"></div>

  <script>
    (async function () {
      const iframe = document.getElementById("embed-frame");
      const errorBox = document.getElementById("embed-error");
      const params = new URLSearchParams(window.location.search);
      const page = params.get("page");

      let lastHeight = 0;
      let rafId = null;

      if (!page) {
        errorBox.style.display = "block";
        errorBox.textContent = "Aucune page à afficher.";
        return;
      }

      if (/^https?:\/\//i.test(page) || page.startsWith("//")) {
        errorBox.style.display = "block";
        errorBox.textContent = "URL externe refusée.";
        return;
      }

      async function getGlobalVersion() {
        try {
          const res = await fetch("./version.json", { cache: "no-store" });
          if (!res.ok) return Date.now();

          const data = await res.json();
          return data.version || Date.now();
        } catch (e) {
          return Date.now();
        }
      }

      function withVersion(url, version) {
        const sep = url.includes("?") ? "&" : "?";
        return url + sep + "_embedv=" + encodeURIComponent(version);
      }

      function getInnerDoc() {
        try {
          return iframe.contentDocument || iframe.contentWindow.document;
        } catch (e) {
          return null;
        }
      }

      function toNumber(value) {
        const number = parseFloat(value);
        return Number.isFinite(number) ? number : 0;
      }

      function getContentHeight() {
        const doc = getInnerDoc();
        if (!doc || !doc.body) return 0;

        const win = iframe.contentWindow;
        if (!win) return 0;

        /*
          Important :
          On évite body.scrollHeight / html.scrollHeight comme mesure principale.
          Dans un spoiler, ces valeurs peuvent inclure la hauteur déjà donnée à l'iframe,
          ce qui provoque une boucle de croissance infinie.
        */

        const preferredRoots = [
          doc.querySelector("[data-embed-root]"),
          doc.querySelector(".quest-accordion"),
          doc.querySelector(".metier-page"),
          doc.querySelector(".page"),
          doc.querySelector("main")
        ].filter(Boolean);

        let height = 0;

        function measureElement(element) {
          if (!element) return;

          const rect = element.getBoundingClientRect();
          const style = win.getComputedStyle(element);

          if (rect.width === 0 && rect.height === 0) return;

          const scrollY =
            win.scrollY ||
            doc.documentElement.scrollTop ||
            doc.body.scrollTop ||
            0;

          const marginBottom = toNumber(style.marginBottom);

          height = Math.max(
            height,
            rect.bottom + scrollY + marginBottom
          );
        }

        if (preferredRoots.length > 0) {
          preferredRoots.forEach(measureElement);
        } else {
          Array.from(doc.body.children).forEach((element) => {
            const tag = element.tagName.toLowerCase();

            if (
              tag === "script" ||
              tag === "style" ||
              tag === "link" ||
              tag === "meta" ||
              tag === "title" ||
              tag === "base"
            ) {
              return;
            }

            measureElement(element);
          });
        }

        if (!height) {
          const bodyRect = doc.body.getBoundingClientRect();
          height = bodyRect.height;
        }

        return Math.ceil(height) + 2;
      }

      function sendHeight() {
        const doc = getInnerDoc();
        if (!doc) return;

        /*
          Si l'iframe est dans un spoiler fermé, sa largeur peut être nulle.
          On évite de calculer une fausse hauteur à ce moment-là.
        */
        if (window.innerWidth < 20) return;

        const height = getContentHeight();
        if (!height || height < 1) return;

        if (Math.abs(height - lastHeight) < 2) return;

        lastHeight = height;
        iframe.style.height = height + "px";

        window.parent.postMessage({
          type: "duralasmetiers:resize",
          height: height
        }, "*");
      }

      function scheduleHeightChecks() {
        if (rafId) {
          cancelAnimationFrame(rafId);
        }

        rafId = requestAnimationFrame(() => {
          rafId = null;
          sendHeight();
        });

        setTimeout(sendHeight, 40);
        setTimeout(sendHeight, 120);
        setTimeout(sendHeight, 300);
        setTimeout(sendHeight, 700);
      }

      function bindDetails(doc) {
        doc.querySelectorAll("details").forEach((detail) => {
          if (detail.dataset.duralasToggleBound) return;

          detail.dataset.duralasToggleBound = "1";

          detail.addEventListener("toggle", () => {
            scheduleHeightChecks();
          });
        });
      }

      function installObservers() {
        const doc = getInnerDoc();
        if (!doc || !doc.body) return;

        const body = doc.body;
        const html = doc.documentElement;

        try {
          if ("ResizeObserver" in window) {
            const resizeObserver = new ResizeObserver(() => {
              scheduleHeightChecks();
            });

            resizeObserver.observe(body);

            if (html) {
              resizeObserver.observe(html);
            }
          }
        } catch (e) {}

        try {
          iframe.contentWindow.addEventListener("load", scheduleHeightChecks);
          iframe.contentWindow.addEventListener("resize", scheduleHeightChecks);
        } catch (e) {}

        try {
          window.addEventListener("resize", scheduleHeightChecks);
          window.addEventListener("pageshow", scheduleHeightChecks);
          document.addEventListener("visibilitychange", scheduleHeightChecks);
        } catch (e) {}

        try {
          Array.from(doc.images || []).forEach((img) => {
            if (!img.complete) {
              img.addEventListener("load", scheduleHeightChecks);
              img.addEventListener("error", scheduleHeightChecks);
            }
          });
        } catch (e) {}

        try {
          if (doc.fonts && doc.fonts.ready) {
            doc.fonts.ready.then(scheduleHeightChecks).catch(() => {});
          }
        } catch (e) {}

        try {
          bindDetails(doc);

          const mutationObserver = new MutationObserver(() => {
            bindDetails(doc);
            scheduleHeightChecks();
          });

          mutationObserver.observe(body, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["open", "style", "class"]
          });
        } catch (e) {}

        scheduleHeightChecks();
      }

      const version = await getGlobalVersion();

      iframe.src = withVersion(page, version);

      iframe.addEventListener("load", () => {
        scheduleHeightChecks();
        installObservers();
      });
    })();
  </script>

</body>
</html>
